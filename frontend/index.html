<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO básico -->
    <title>JG Sistemas — Sistema de Gestão Escolar | Matrículas, Financeiro e Frequência</title>
    <meta name="description" content="Sistema de gestão escolar completo: cadastro de alunos, matrículas, turmas, frequência, avaliações, boletins, certificados, financeiro, mensalidades, carnês, contratos, agenda e relatórios. Gestão escolar online, segura e na nuvem." />
    <meta name="keywords" content="sistema de gestão escolar, software para escolas, gestão escolar online, matrícula escolar, controle de frequência, mensalidades escolares, financeiro escolar, boletim escolar, certificados, agenda escolar, escola de inglês, sistema para secretaria escolar" />
    <meta name="author" content="JG Sistemas" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="theme-color" content="#4f46e5" />
    <link rel="canonical" href="https://jgsistemas.vercel.app/" />

    <!-- Open Graph (Facebook / WhatsApp / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JG Sistemas" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://jgsistemas.vercel.app/" />
    <meta property="og:title" content="JG Sistemas — Sistema de Gestão Escolar Completo" />
    <meta property="og:description" content="Gerencie alunos, matrículas, financeiro, frequência, boletins e relatórios em um só lugar. Gestão escolar online, segura e na nuvem." />
    <meta property="og:image" content="https://jgsistemas.vercel.app/vite.svg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="JG Sistemas — Sistema de Gestão Escolar Completo" />
    <meta name="twitter:description" content="Gerencie alunos, matrículas, financeiro, frequência, boletins e relatórios em um só lugar." />
    <meta name="twitter:image" content="https://jgsistemas.vercel.app/vite.svg" />

    <!-- Structured data: SoftwareApplication + WebSite + Organization (Schema.org) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "SoftwareApplication",
          "name": "JG Sistemas — Sistema de Gestão Escolar",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web",
          "url": "https://jgsistemas.vercel.app/",
          "description": "Sistema de gestão escolar completo com cadastro de alunos, matrículas, turmas, frequência, avaliações, boletins, certificados, financeiro, mensalidades, carnês, contratos, agenda e relatórios.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "BRL" },
          "aggregateRating": { "@type": "AggregateRating", "ratingValue": "5", "ratingCount": "1" },
          "featureList": "Cadastro de alunos; Matrículas; Turmas; Frequência; Avaliações; Boletins; Certificados; Financeiro; Mensalidades; Carnês; Contratos; Agenda; Relatórios; Auditoria"
        },
        {
          "@type": "WebSite",
          "name": "JG Sistemas",
          "url": "https://jgsistemas.vercel.app/",
          "inLanguage": "pt-BR",
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://jgsistemas.vercel.app/?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        },
        {
          "@type": "Organization",
          "name": "JG Sistemas",
          "url": "https://jgsistemas.vercel.app/",
          "description": "Fornecedora de software de gestão escolar."
        }
      ]
    }
    </script>

    <script src="/theme-init.js"></script>
  </head>
  <body class="bg-slate-50 dark:bg-[#0b1220]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
