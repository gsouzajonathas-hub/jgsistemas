name: CI

# Roda a suíte de testes e o build em todo push/PR contra main, para pegar
# regressões antes do deploy (hoje o único workflow existente é o keep-alive
# de health-check da Render — não havia validação automática de código).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Rodar testes
        run: pytest

  frontend:
    name: Frontend (typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Testes
        run: npx vitest run --pool=threads --maxWorkers=2
      - name: Build
        run: npm run build
