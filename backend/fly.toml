app = "jgsistemas-backend"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    ENVIRONMENT = "production"

[env]
  ENVIRONMENT = "production"
  DATA_DIR = "/data"
  UPLOAD_DIR = "/data/uploads"
  ACCESS_TOKEN_EXPIRE_MINUTES = "60"

[experimental]
  auto_rollback = true

[[services]]
  internal_port = 8000
  protocol = "tcp"

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls"]
    port = 443

[[mounts]]
  source = "data"
  destination = "/data"
